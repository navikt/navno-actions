name: Setup JVM toolchain
description: Installs a JDK and Gradle.

inputs:
  java-version:
    description: JDK major version.
    required: false
    default: '21'
  distribution:
    description: JDK distribution.
    required: false
    default: temurin
  dependency-graph:
    description: '`auto`, `disabled`, `generate` or `generate-and-submit`. `auto` submits on the default branch only.'
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Resolve dependency-graph mode
      id: mode
      shell: bash
      env:
        REQUESTED: ${{ inputs.dependency-graph }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ "$REQUESTED" != "auto" ]; then
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
        elif [ "$REF_NAME" = "${DEFAULT_BRANCH:-main}" ]; then
          echo "value=generate-and-submit" >> "$GITHUB_OUTPUT"
        else
          echo "value=disabled" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        dependency-graph: ${{ steps.mode.outputs.value }}
