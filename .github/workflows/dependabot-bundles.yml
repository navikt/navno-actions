name: Rebuild bundles on dependabot PRs

# Dependabot bumps leave dist/ stale, so rebuild and push it onto the PR.
# A push with the job token does not trigger CI; re-run it by hand.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: navno-actions-bundles-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild and push */dist
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: ./setup-node-pnpm

      - run: pnpm run build

      - name: Commit and push the bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*/dist/'
          if git diff --cached --quiet; then
            echo "bundles are already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild bundles"
          git push
