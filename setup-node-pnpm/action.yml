name: Setup Node and pnpm
description: Installs Node and pnpm at the versions in package.json, then runs `pnpm install`.
inputs:
  reader-token:
    description: Token for installing private packages.
    required: false
    default: ''
  install:
    description: Run `pnpm install`.
    required: false
    default: 'true'
  frozen-lockfile:
    description: Pass `--frozen-lockfile`. Dependabot needs `false`.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    # setup-node falls back to the runner's Node when engines.node is missing
    - name: Ensure package.json has `engines.node`
      shell: bash
      run: node "${{ github.action_path }}/../check-node-version/dist/index.mjs"

    - name: Setup pnpm
      uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        registry-url: https://npm.pkg.github.com
        cache: pnpm

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.reader-token }}
      run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
